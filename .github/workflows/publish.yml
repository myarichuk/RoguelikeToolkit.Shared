name: Publish

# Tag-driven releases. Tags are created by release-please from conventional
# commits (e.g. event-aggregator-v1.2.3), so a package is only published when
# it actually changed. Each run publishes one package to both distributions:
#  - NuGet (.nupkg, versioned by MinVer from the tag via MinVerTagPrefix)
#  - UPM (tarball attached to the GitHub Release, picked up by OpenUPM)
#
# Setup: register this repo + workflow as a trusted publisher on nuget.org
# (account menu -> Trusted Publishing). No API key secret needed.

on:
  push:
    tags: ['*-v*']

permissions:
  contents: read

jobs:
  publish:
    # External publishing (NuGet push + OpenUPM notify) runs only when the
    # PUBLISH_ENABLED repo variable is 'true' (Settings -> Secrets and
    # variables -> Actions -> Variables tab). Absent or any other value means
    # skip. Everything else (build, test, pack, UPM tarball attach) still runs
    # so tag pushes validate the release pipeline. The repository check stays
    # so fork tag pushes never publish.
    if: github.repository == 'myarichuk/RoguelikeToolkit.Shared'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Attach the UPM tarball to the GitHub Release.
      id-token: write # Required for NuGet trusted publishing (OIDC).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so MinVer can compute the version.
          fetch-depth: 0

      - name: Resolve package from tag
        # Convention-driven (eng/packages.py): the tag's component names the package whose
        # package.json is src/<Name>/package.json. No per-package case statement to maintain.
        id: target
        run: python3 eng/packages.py resolve "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Tag version must match package.json
        run: |
          actual="$(jq -r .version "${{ steps.target.outputs.dir }}/package.json")"
          if [ "$actual" != "${{ steps.target.outputs.version }}" ]; then
            echo "::error::Tag says ${{ steps.target.outputs.version }} but package.json says $actual"
            exit 1
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Check repo consistency
        run: python3 eng/packages.py check

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack NuGet
        run: dotnet pack "${{ steps.target.outputs.csproj }}" --no-build -c Release -o ./nupkgs

      - name: Inspect package
        run: python3 eng/packages.py pack-check ./nupkgs --component "${{ steps.target.outputs.component }}"

      - name: Login to NuGet (trusted publishing)
        id: nuget-login
        if: vars.PUBLISH_ENABLED == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # Required input: the nuget.org username the trusted publisher is registered under.
          user: michael.yarichuk

      - name: Push to NuGet
        if: vars.PUBLISH_ENABLED == 'true'
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Pack UPM tarball
        # --pack-destination resolves against working-directory, so it must be
        # absolute to land where the attach step (repo root) expects it.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upm-dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/upm-dist"
        working-directory: ${{ steps.target.outputs.dir }}

      - name: Attach UPM tarball to release
        run: gh release upload "${GITHUB_REF_NAME}" ./upm-dist/*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify OpenUPM
        if: vars.PUBLISH_ENABLED == 'true'
        uses: openupm/openupm-action@89b79dc8dd6cb319efff06727f8fa0051ce7e517 # v1.0.1
        continue-on-error: true # No-op until the one-time OpenUPM registration is done (see README.md).
        with:
          package: ${{ steps.target.outputs.name }}
          tag: ${{ github.ref_name }}
