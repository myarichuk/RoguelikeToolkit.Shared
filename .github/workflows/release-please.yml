name: Release Please

# Maintains CHANGELOG.md, bumps package.json versions, and creates tags +
# GitHub Releases from conventional commits (see README.md). The Publish
# workflow picks up the resulting *-v* tags.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
