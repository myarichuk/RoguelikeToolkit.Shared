name: Release Please

# Maintains CHANGELOG.md, bumps package.json versions, and creates tags +
# GitHub Releases from conventional commits (see README.md). The Publish
# workflow picks up the resulting *-v* tags.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # PAT (stored as a secret) so the tags + releases it creates trigger
          # the tag-driven Publish workflow. The default GITHUB_TOKEN's pushes
          # do not trigger downstream workflows, which silently disables publishing.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
