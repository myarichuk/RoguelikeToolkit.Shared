name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    # Cheap structural checks, and the package list every other job fans out over.
    # A new package under src/ shows up here with no workflow edit.
    name: Repo checks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check package consistency (solution, release config, .meta files, pinned actions)
        run: python3 eng/packages.py check

      - name: List packages
        id: packages
        run: echo "matrix=$(python3 eng/packages.py matrix)" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.title }}
    needs: repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.repo.outputs.matrix) }}
    env:
      # Mirrored here (rather than read via secrets.* in `if:`, which GitHub rejects) so steps can
      # gate on its presence. Empty on fork PRs.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so MinVer can compute semantic versions.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ matrix.tests }}

      - name: Build (warnings are errors; includes the public API analyzer)
        run: dotnet build ${{ matrix.tests }} --no-restore -c Release

      - name: Compile the sources the way Unity does (C# 9, nullable context off)
        run: dotnet build eng/UnityCompat -c Release -p:PackageDir="$GITHUB_WORKSPACE/${{ matrix.dir }}"

      - name: Test with coverage
        run: >
          dotnet test ${{ matrix.tests }} --no-build -c Release
          -s coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Generate coverage report
        run: >
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:coveragereport -reporttypes:"MarkdownSummaryGithub;Cobertura;Html"

      - name: Publish coverage summary
        run: |
          {
            echo "## ${{ matrix.title }}"
            cat coveragereport/SummaryGithub.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        # Secrets are empty on PRs from forks, so skip instead of failing.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coveragereport/Cobertura.xml
          flags: ${{ matrix.component }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Enforce coverage threshold (90% lines)
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          rate = float(ET.parse("coveragereport/Cobertura.xml").getroot().attrib["line-rate"])
          print(f"${{ matrix.component }}: line coverage {rate:.1%} (threshold 90%)")
          if rate < 0.90:
              print("::error::${{ matrix.component }} line coverage below the 90% threshold")
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.component }}
          path: coveragereport/

  pack:
    # Packs everything exactly as the publish workflow will, and inspects the result.
    name: Pack and inspect
    needs: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Pack NuGet packages
        run: dotnet pack RoguelikeToolkit.slnx -c Release -o ./nupkgs

      - name: Inspect NuGet packages and UPM tarballs
        run: python3 eng/packages.py pack-check ./nupkgs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: nupkgs/
